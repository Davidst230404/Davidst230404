name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "17 2 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SVG statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          USER = "Davidst230404"
          TOKEN = os.environ["GH_TOKEN"]
          API = "https://api.github.com"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "github-profile-stats"
          }

          def get(path):
              req = urllib.request.Request(
                  API + path,
                  headers=headers
              )

              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def esc(value):
              return (
                  str(value)
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
                  .replace('"', "&quot;")
              )

          # =========================================================
          # USER INFORMATION
          # =========================================================

          user = get(f"/users/{USER}")

          # =========================================================
          # REPOSITORIES
          # =========================================================

          repos = []
          page = 1

          while page <= 10:

              batch = get(
                  f"/users/{USER}/repos"
                  f"?per_page=100&page={page}"
                  f"&type=owner&sort=updated"
              )

              if not batch:
                  break

              repos.extend(batch)

              if len(batch) < 100:
                  break

              page += 1

          # Ignore forked repositories
          owned = [
              repo
              for repo in repos
              if not repo.get("fork")
          ]

          # =========================================================
          # STARS & FORKS
          # =========================================================

          stars = sum(
              repo.get("stargazers_count", 0)
              for repo in owned
          )

          forks = sum(
              repo.get("forks_count", 0)
              for repo in owned
          )

          # =========================================================
          # PROGRAMMING LANGUAGES
          # =========================================================

          lang_bytes = {}

          for repo in owned:

              try:

                  language_path = repo["languages_url"].replace(
                      API,
                      ""
                  )

                  languages = get(language_path)

                  for language, count in languages.items():

                      lang_bytes[language] = (
                          lang_bytes.get(language, 0) + count
                      )

              except Exception:
                  pass

          total_lang = sum(lang_bytes.values()) or 1

          top_languages = sorted(
              lang_bytes.items(),
              key=lambda item: item[1],
              reverse=True
          )[:6]

          # =========================================================
          # BASIC STATISTICS
          # =========================================================

          stats = {
              "public_repos": user.get("public_repos", 0),
              "followers": user.get("followers", 0),
              "stars": stars,
              "forks": forks
          }

          # =========================================================
          # SVG CARD HELPER
          # =========================================================

          def svg_card(title, width=495, height=170):

              return [

                  f'<svg xmlns="http://www.w3.org/2000/svg" '
                  f'width="{width}" height="{height}" '
                  f'viewBox="0 0 {width} {height}">',

                  '<rect width="100%" height="100%" '
                  'rx="10" fill="#0d1117" stroke="#30363d"/>',

                  f'<text x="25" y="34" '
                  f'fill="#58a6ff" '
                  f'font-family="Arial, sans-serif" '
                  f'font-size="20" '
                  f'font-weight="700">'
                  f'{esc(title)}</text>'
              ]

          # =========================================================
          # GITHUB STATISTICS
          # =========================================================

          stats_svg = svg_card(
              "GitHub Statistics"
          )

          items = [

              (
                  "Public Repositories",
                  stats["public_repos"]
              ),

              (
                  "Followers",
                  stats["followers"]
              ),

              (
                  "Total Stars",
                  stats["stars"]
              ),

              (
                  "Total Forks",
                  stats["forks"]
              )

          ]

          positions = [
              (25, 75),
              (260, 75),
              (25, 125),
              (260, 125)
          ]

          for (label, value), (x, y) in zip(
              items,
              positions
          ):

              stats_svg.append(

                  f'<text x="{x}" y="{y}" '
                  f'fill="#8b949e" '
                  f'font-family="Arial, sans-serif" '
                  f'font-size="12">'
                  f'{esc(label)}</text>'

              )

              stats_svg.append(

                  f'<text x="{x}" y="{y + 22}" '
                  f'fill="#f0f6fc" '
                  f'font-family="Arial, sans-serif" '
                  f'font-size="19" '
                  f'font-weight="700">'
                  f'{esc(value)}</text>'

              )

          stats_svg.append("</svg>")

          # Save to repository root
          Path("stats.svg").write_text(
              "\n".join(stats_svg),
              encoding="utf-8"
          )

          # =========================================================
          # TOP LANGUAGES
          # =========================================================

          languages_svg = svg_card(
              "Top Languages"
          )

          if top_languages:

              y = 62

              for language, count in top_languages:

                  percentage = (
                      count / total_lang * 100
                  )

                  bar_width = max(
                      2,
                      min(
                          250,
                          int(percentage * 4.2)
                      )
                  )

                  languages_svg.append(

                      f'<text x="25" y="{y}" '
                      f'fill="#f0f6fc" '
                      f'font-family="Arial, sans-serif" '
                      f'font-size="13">'
                      f'{esc(language)}</text>'

                  )

                  languages_svg.append(

                      f'<rect x="125" y="{y - 11}" '
                      f'width="250" height="10" '
                      f'rx="5" fill="#21262d"/>'

                  )

                  languages_svg.append(

                      f'<rect x="125" y="{y - 11}" '
                      f'width="{bar_width}" height="10" '
                      f'rx="5" fill="#58a6ff"/>'

                  )

                  languages_svg.append(

                      f'<text x="390" y="{y}" '
                      f'fill="#8b949e" '
                      f'font-family="Arial, sans-serif" '
                      f'font-size="12">'
                      f'{percentage:.1f}%</text>'

                  )

                  y += 18

          else:

              languages_svg.append(

                  '<text x="25" y="80" '
                  'fill="#8b949e" '
                  'font-family="Arial, sans-serif" '
                  'font-size="13">'
                  'No language data available yet.</text>'

              )

          languages_svg.append("</svg>")

          # Save to repository root
          Path("top-langs.svg").write_text(
              "\n".join(languages_svg),
              encoding="utf-8"
          )

          # =========================================================
          # CONTRIBUTION ACTIVITY
          # =========================================================

          graphql_query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          graphql_payload = json.dumps({

              "query": graphql_query,

              "variables": {
                  "login": USER
              }

          }).encode("utf-8")

          graphql_request = urllib.request.Request(

              f"{API}/graphql",

              data=graphql_payload,

              headers={
                  **headers,
                  "Content-Type": "application/json"
              },

              method="POST"

          )

          with urllib.request.urlopen(
              graphql_request,
              timeout=30
          ) as response:

              contribution_data = json.load(response)

          # Check GraphQL errors
          if contribution_data.get("errors"):

              raise RuntimeError(
                  "GitHub GraphQL error: "
                  + json.dumps(
                      contribution_data["errors"]
                  )
              )

          calendar = (
              contribution_data["data"]
              ["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
          )

          total_contributions = (
              calendar["totalContributions"]
          )

          # Flatten contribution days
          days = []

          for week in calendar["weeks"]:

              for day in week["contributionDays"]:

                  days.append(day)

          # Keep approximately one year
          days = days[-365:]

          # =========================================================
          # CONTRIBUTION SVG
          # =========================================================

          width = 900
          height = 190

          activity_svg = [

              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{width}" height="{height}" '
              f'viewBox="0 0 {width} {height}">',

              '<rect width="100%" height="100%" '
              'rx="10" fill="#0d1117" stroke="#30363d"/>',

              '<text x="25" y="32" '
              'fill="#58a6ff" '
              'font-family="Arial, sans-serif" '
              'font-size="20" '
              'font-weight="700">'
              'Contribution Activity</text>',

              f'<text x="25" y="55" '
              f'fill="#8b949e" '
              f'font-family="Arial, sans-serif" '
              f'font-size="12">'
              f'{total_contributions} contributions in the last year'
              f'</text>'

          ]

          # =========================================================
          # CONTRIBUTION GRID
          # =========================================================

          start_x = 25
          start_y = 75

          cell = 11
          gap = 3

          for index, day in enumerate(days):

              column = index // 7
              row = index % 7

              x = (
                  start_x
                  + column * (cell + gap)
              )

              y = (
                  start_y
                  + row * (cell + gap)
              )

              count = day["contributionCount"]

              # GitHub-style contribution levels
              if count == 0:

                  fill = "#161b22"

              elif count <= 2:

                  fill = "#0e4429"

              elif count <= 5:

                  fill = "#006d32"

              elif count <= 10:

                  fill = "#26a641"

              else:

                  fill = "#39d353"

              activity_svg.append(

                  f'<rect x="{x}" y="{y}" '
                  f'width="{cell}" '
                  f'height="{cell}" '
                  f'rx="2" '
                  f'fill="{fill}">'

                  f'<title>'
                  f'{esc(day["date"])}: '
                  f'{count} contributions'
                  f'</title>'

                  f'</rect>'

              )

          # =========================================================
          # LEGEND
          # =========================================================

          legend_y = 165

          activity_svg.append(

              '<text x="25" y="170" '
              'fill="#8b949e" '
              'font-family="Arial, sans-serif" '
              'font-size="11">'
              'Less</text>'

          )

          legend_colors = [
              "#161b22",
              "#0e4429",
              "#006d32",
              "#26a641",
              "#39d353"
          ]

          legend_x = 60

          for color in legend_colors:

              activity_svg.append(

                  f'<rect x="{legend_x}" '
                  f'y="{legend_y - 10}" '
                  f'width="11" '
                  f'height="11" '
                  f'rx="2" '
                  f'fill="{color}"/>'

              )

              legend_x += 16

          activity_svg.append(

              '<text x="150" y="170" '
              'fill="#8b949e" '
              'font-family="Arial, sans-serif" '
              'font-size="11">'
              'More</text>'

          )

          activity_svg.append("</svg>")

          # Save to repository root
          Path("contribution-activity.svg").write_text(
              "\n".join(activity_svg),
              encoding="utf-8"
          )

          # =========================================================
          # OUTPUT
          # =========================================================

          print("========================================")
          print("GitHub profile statistics generated.")
          print("========================================")
          print("Created: stats.svg")
          print("Created: top-langs.svg")
          print("Created: contribution-activity.svg")
          print(f"Total contributions: {total_contributions}")
          print("========================================")

          PY

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats.svg top-langs.svg contribution-activity.svg

          if git diff --cached --quiet; then
            echo "No statistics changes detected."
          else
            git commit -m "chore: update GitHub profile stats"
            git push
          fi
