name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "17 2 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SVG statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          USER = "Davidst230404"
          TOKEN = os.environ["GH_TOKEN"]
          API = "https://api.github.com"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "github-profile-stats"
          }

          def get(path):
              req = urllib.request.Request(
                  API + path,
                  headers=headers
              )

              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def esc(value):
              return (
                  str(value)
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
                  .replace('"', "&quot;")
              )

          # Get user information
          user = get(f"/users/{USER}")

          # Get repositories
          repos = []
          page = 1

          while page <= 10:
              batch = get(
                  f"/users/{USER}/repos"
                  f"?per_page=100&page={page}"
                  f"&type=owner&sort=updated"
              )

              if not batch:
                  break

              repos.extend(batch)

              if len(batch) < 100:
                  break

              page += 1

          # Ignore forked repositories
          owned = [
              repo
              for repo in repos
              if not repo.get("fork")
          ]

          # Calculate stars and forks
          stars = sum(
              repo.get("stargazers_count", 0)
              for repo in owned
          )

          forks = sum(
              repo.get("forks_count", 0)
              for repo in owned
          )

          # Aggregate programming languages
          lang_bytes = {}

          for repo in owned:
              try:
                  language_path = repo["languages_url"].replace(API, "")
                  languages = get(language_path)

                  for language, count in languages.items():
                      lang_bytes[language] = (
                          lang_bytes.get(language, 0) + count
                      )

              except Exception:
                  pass

          total_lang = sum(lang_bytes.values()) or 1

          top_languages = sorted(
              lang_bytes.items(),
              key=lambda item: item[1],
              reverse=True
          )[:6]

          # Statistics
          stats = {
              "public_repos": user.get("public_repos", 0),
              "followers": user.get("followers", 0),
              "stars": stars,
              "forks": forks
          }

          # SVG card helper
          def svg_card(title, width=495, height=170):
              return [
                  f'<svg xmlns="http://www.w3.org/2000/svg" '
                  f'width="{width}" height="{height}" '
                  f'viewBox="0 0 {width} {height}">',

                  '<rect width="100%" height="100%" '
                  'rx="10" fill="#0d1117" stroke="#30363d"/>',

                  f'<text x="25" y="34" '
                  f'fill="#58a6ff" '
                  f'font-family="Arial, sans-serif" '
                  f'font-size="20" '
                  f'font-weight="700">'
                  f'{esc(title)}</text>'
              ]

          # =========================================================
          # GITHUB STATISTICS
          # =========================================================

          stats_svg = svg_card("GitHub Statistics")

          items = [
              (
                  "Public Repositories",
                  stats["public_repos"]
              ),
              (
                  "Followers",
                  stats["followers"]
              ),
              (
                  "Total Stars",
                  stats["stars"]
              ),
              (
                  "Total Forks",
                  stats["forks"]
              )
          ]

          positions = [
              (25, 75),
              (260, 75),
              (25, 125),
              (260, 125)
          ]

          for (label, value), (x, y) in zip(
              items,
              positions
          ):
              stats_svg.append(
                  f'<text x="{x}" y="{y}" '
                  f'fill="#8b949e" '
                  f'font-family="Arial, sans-serif" '
                  f'font-size="12">'
                  f'{esc(label)}</text>'
              )

              stats_svg.append(
                  f'<text x="{x}" y="{y + 22}" '
                  f'fill="#f0f6fc" '
                  f'font-family="Arial, sans-serif" '
                  f'font-size="19" '
                  f'font-weight="700">'
                  f'{esc(value)}</text>'
              )

          stats_svg.append("</svg>")

          # IMPORTANT:
          # Save directly to repository root.
          Path("stats.svg").write_text(
              "\n".join(stats_svg),
              encoding="utf-8"
          )

          # =========================================================
          # TOP LANGUAGES
          # =========================================================

          languages_svg = svg_card("Top Languages")

          if top_languages:

              y = 62

              for language, count in top_languages:

                  percentage = (
                      count / total_lang * 100
                  )

                  bar_width = max(
                      2,
                      min(
                          250,
                          int(percentage * 4.2)
                      )
                  )

                  languages_svg.append(
                      f'<text x="25" y="{y}" '
                      f'fill="#f0f6fc" '
                      f'font-family="Arial, sans-serif" '
                      f'font-size="13">'
                      f'{esc(language)}</text>'
                  )

                  languages_svg.append(
                      f'<rect x="125" y="{y - 11}" '
                      f'width="250" height="10" '
                      f'rx="5" fill="#21262d"/>'
                  )

                  languages_svg.append(
                      f'<rect x="125" y="{y - 11}" '
                      f'width="{bar_width}" height="10" '
                      f'rx="5" fill="#58a6ff"/>'
                  )

                  languages_svg.append(
                      f'<text x="390" y="{y}" '
                      f'fill="#8b949e" '
                      f'font-family="Arial, sans-serif" '
                      f'font-size="12">'
                      f'{percentage:.1f}%</text>'
                  )

                  y += 18

          else:

              languages_svg.append(
                  '<text x="25" y="80" '
                  'fill="#8b949e" '
                  'font-family="Arial, sans-serif" '
                  'font-size="13">'
                  'No language data available yet.</text>'
              )

          languages_svg.append("</svg>")

          # IMPORTANT:
          # Save directly to repository root.
          Path("top-langs.svg").write_text(
              "\n".join(languages_svg),
              encoding="utf-8"
          )

          print("GitHub statistics generated successfully.")
          print("Created: stats.svg")
          print("Created: top-langs.svg")

          PY

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats.svg top-langs.svg

          if git diff --cached --quiet; then
            echo "No statistics changes detected."
          else
            git commit -m "chore: update GitHub profile stats"
            git push
          fi
