name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SVG statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          USER = "Davidst230404"
          TOKEN = os.environ["GH_TOKEN"]
          API = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "github-profile-stats"
          }

          def get(path):
              req = urllib.request.Request(API + path, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def esc(s):
              return (str(s).replace("&", "&amp;").replace("<", "&lt;")
                      .replace(">", "&gt;").replace('"', "&quot;"))

          user = get(f"/users/{USER}")
          repos = []
          page = 1
          while page <= 10:
              batch = get(f"/users/{USER}/repos?per_page=100&page={page}&type=owner&sort=updated")
              if not batch:
                  break
              repos.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          owned = [r for r in repos if not r.get("fork")]
          stars = sum(r.get("stargazers_count", 0) for r in owned)
          forks = sum(r.get("forks_count", 0) for r in owned)

          # Aggregate language bytes across owned repositories.
          lang_bytes = {}
          for repo in owned:
              try:
                  langs = get(repo["languages_url"].replace(API, ""))
                  for lang, count in langs.items():
                      lang_bytes[lang] = lang_bytes.get(lang, 0) + count
              except Exception:
                  pass

          total_lang = sum(lang_bytes.values()) or 1
          top = sorted(lang_bytes.items(), key=lambda x: x[1], reverse=True)[:6]

          stats = {
              "public_repos": user.get("public_repos", 0),
              "followers": user.get("followers", 0),
              "stars": stars,
              "forks": forks,
              "commits": None,
          }

          # GitHub's REST API does not expose a cheap global commit count.
          # We intentionally omit it instead of showing an unreliable number.

          def svg_card(title, width=495, height=170):
              return [
                  f'<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}" viewBox="0 0 {width} {height}">',
                  '<rect width="100%" height="100%" rx="10" fill="#0d1117" stroke="#30363d"/>',
                  f'<text x="25" y="34" fill="#58a6ff" font-family="Arial, sans-serif" font-size="20" font-weight="700">{esc(title)}</text>'
              ]

          # Stats card
          s = svg_card("GitHub Statistics")
          items = [
              ("Public Repositories", stats["public_repos"]),
              ("Followers", stats["followers"]),
              ("Total Stars", stats["stars"]),
              ("Total Forks", stats["forks"]),
          ]
          positions = [(25, 75), (260, 75), (25, 125), (260, 125)]
          for (label, value), (x, y) in zip(items, positions):
              s.append(f'<text x="{x}" y="{y}" fill="#8b949e" font-family="Arial, sans-serif" font-size="12">{esc(label)}</text>')
              s.append(f'<text x="{x}" y="{y+22}" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="19" font-weight="700">{esc(value)}</text>')
          s.append('</svg>')
          Path("profile/stats.svg").write_text("\n".join(s), encoding="utf-8")

          # Languages card
          l = svg_card("Top Languages")
          if top:
              y = 62
              for lang, count in top:
                  pct = count / total_lang * 100
                  bar = max(2, int(pct * 4.2))
                  l.append(f'<text x="25" y="{y}" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="13">{esc(lang)}</text>')
                  l.append(f'<rect x="125" y="{y-11}" width="250" height="10" rx="5" fill="#21262d"/>')
                  l.append(f'<rect x="125" y="{y-11}" width="{bar}" height="10" rx="5" fill="#58a6ff"/>')
                  l.append(f'<text x="390" y="{y}" fill="#8b949e" font-family="Arial, sans-serif" font-size="12">{pct:.1f}%</text>')
                  y += 18
          else:
              l.append('<text x="25" y="80" fill="#8b949e" font-family="Arial, sans-serif" font-size="13">No language data available yet.</text>')
          l.append('</svg>')
          Path("profile/top-langs.svg").write_text("\n".join(l), encoding="utf-8")
          PY

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub profile stats"
          git push
